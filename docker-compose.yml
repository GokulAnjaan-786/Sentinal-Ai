# ==========================================
# SentinelAI Docker Compose
# ==========================================
# Complete development environment with:
# - PostgreSQL database
# - FastAPI backend
# - React frontend (served by nginx)
#
# Usage:
#   Start:   docker-compose up -d
#   Stop:    docker-compose down
#   Logs:    docker-compose logs -f
#   Reset:   docker-compose down -v && docker-compose up -d
#   Seed:    docker-compose exec backend python -m scripts.seed_database

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  database:
    image: postgres:16-alpine
    container_name: sentinelai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinelai_db
      POSTGRES_USER: sentinelai
      POSTGRES_PASSWORD: sentinelai_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelai -d sentinelai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelai_network

  # ==========================================
  # FastAPI Backend
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinelai_backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://sentinelai:sentinelai_secret@database:5432/sentinelai_db
      DATABASE_SYNC_URL: postgresql://sentinelai:sentinelai_secret@database:5432/sentinelai_db
      JWT_SECRET_KEY: sentinelai-dev-jwt-secret-change-in-production
      APP_SECRET_KEY: sentinelai-dev-secret-key-change-in-production
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost"]'
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ml_models:/app/ml/data/models
    depends_on:
      database:
        condition: service_healthy
    networks:
      - sentinelai_network
    command: >
      sh -c "python -m scripts.seed_database 2>/dev/null; 
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ==========================================
  # React Frontend
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sentinelai_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sentinelai_network

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    driver: local
  ml_models:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  sentinelai_network:
    driver: bridge
